name: CI

on:
  # Weekly, so a green badge means the checks pass now, not on the day of the last push.
  schedule:
    - cron: "20 6 * * 6"
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Hold the workbook to the public data and the reference model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # ruff is pinned to the release the code was linted with: an unpinned
      # install picked up 0.16, whose wider default rule set failed a green build.
      - name: Install
        run: pip install -r requirements.txt ruff==0.15.21

      - name: Lint
        run: ruff check .

      # The Power BI project is generated from powerbi/*_spec.py. If the committed
      # project differs from what the spec writes today, one of them was edited alone.
      - name: The Power BI project must match its spec
        run: python -m powerbi.build_pbip --check

      - name: Run the pandas reference model
        run: python model/reference.py

      # Excel does not run on Linux, so CI cannot rebuild the workbook. It does
      # the next best thing: reads the committed workbook's cached values and
      # holds every published figure to the reference model, to the cent.
      - name: Tests
        run: python -m pytest -q

      - name: The README test badge must match what the suite collects
        run: |
          collected=$(python -m pytest --collect-only -q 2>/dev/null | grep -oE '[0-9]+ tests? collected' | grep -oE '^[0-9]+')
          claimed=$(grep -oE 'badge/tests-[0-9%C,]+%20(passing|collected)' README.md | head -1 | sed -E 's|badge/tests-||; s|%20(passing\|collected)||; s|%2C||g; s|,||g')
          echo "suite collects: ${collected:-<none>}   README badge: ${claimed:-<none>}"
          if [ -z "$collected" ] || [ -z "$claimed" ]; then
            echo "::error::could not read one of the two numbers"; exit 1
          fi
          if [ "$collected" != "$claimed" ]; then
            echo "::error::README badge says $claimed, suite collects $collected"; exit 1
          fi
